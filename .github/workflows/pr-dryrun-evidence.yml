name: PR Dry-run Evidence

# Before/after dry-run counts for pull requests that change a scraper source
# (spec docs/specs/active/agent-autonomy/proposal.md §8, D1②). The comment is
# evidence for the user's weekly review. It cannot prove a fix for a source
# that already scrapes fine on Actions but is 0 in production (prtimes, #538);
# the comment says so, and #450 checks production after merge.
#
# Safety:
# - Three jobs. `files` reads the PR's metadata only. `dryrun` runs the PR's
#   code with a read-only token and no secrets; everything it uploads is
#   untrusted. `comment` never checks out the PR: it parses the raw output
#   with the default branch's scripts/ci/dryrun_evidence.py and posts it.
# - Same-repository PRs only (heartbeat and agent branches). Fork PRs get
#   nothing.
# - --dry-run never writes to the database; no Supabase/OpenAI secrets are
#   passed, so sources that need credentials fail and are NOT TESTED.
# - At most MAX_SOURCES registered sources (not modules: hanshin.py holds
#   four), 300 s each, base and head. The source named by the PR's
#   "Closes #n" issue goes first. Shared modules (_*.py) are listed as untested.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scraper/sources/**"

permissions: {}

concurrency:
  group: pr-dryrun-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MAX_SOURCES: 3

jobs:
  files:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      issues: read
    outputs:
      modules: ${{ steps.list.outputs.modules }}
      preferred: ${{ steps.list.outputs.preferred }}
      shared: ${{ steps.list.outputs.shared }}
    steps:
      - name: List changed source modules
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | select(.status != "removed") | .filename' > files.txt
          # Module files directly under scraper/sources/. Names are validated here
          # and again before every use.
          grep -E '^scraper/sources/[a-z0-9_]+\.py$' files.txt | sed -E 's|^scraper/sources/||; s|\.py$||' \
            | sort -u > all.txt || true
          grep -vE '^(base|__init__|_.*)$' all.txt > modules.txt || true
          shared=$(grep -E '^(base|_.*)$' all.txt | tr '\n' ' ' | sed 's/ $//' || true)
          echo "modules=$(tr '\n' ' ' < modules.txt | sed 's/ $//')" >> "$GITHUB_OUTPUT"
          echo "shared=$shared" >> "$GITHUB_OUTPUT"
          # Source named by the first "Closes #n" issue title ("<source>：…"), if any.
          preferred=""
          n=$(printf '%s' "$PR_BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$n" ]; then
            title=$(gh api "repos/$REPO/issues/$n" --jq '.title' 2>/dev/null || true)
            cand="${title%%：*}"
            if [[ "$cand" =~ ^[a-z0-9_]+$ ]] && [ "$cand" != "$title" ]; then preferred="$cand"; fi
          fi
          echo "preferred=$preferred" >> "$GITHUB_OUTPUT"

  dryrun:
    needs: files
    if: needs.files.outputs.modules != '' || needs.files.outputs.shared != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Check out the PR base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: head/scraper/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r head/scraper/requirements.txt
          playwright install chromium --with-deps

      - name: Dry-run base and head
        env:
          MODULES: ${{ needs.files.outputs.modules }}
          PREFERRED: ${{ needs.files.outputs.preferred }}
        run: |
          set -u
          mkdir -p raw
          if ! [[ "$MODULES" =~ ^[a-z0-9_\ ]*$ && "$PREFERRED" =~ ^[a-z0-9_]*$ ]]; then
            echo "invalid module list"; exit 1
          fi
          read -ra LIST <<< "$MODULES"
          [ "${#LIST[@]}" -gt 0 ] || exit 0
          # Registered source keys in the changed modules, from each side's own main.py.
          for side in head base; do
            ( cd "$side/scraper" && timeout 120 python - "${LIST[@]}" > "$RUNNER_TEMP/keys-$side.txt" 2>/dev/null <<'PY'
          import sys
          import main
          wanted = set(sys.argv[1:])
          for s in main.SCRAPERS:
              if type(s).__module__.rsplit(".", 1)[-1] in wanted:
                  print(main._scraper_key(s))
          PY
            ) || echo "::warning::$side: could not import main.py"
          done
          # Preferred first, then head's order, then base-only keys; at most MAX_SOURCES.
          { [ -n "$PREFERRED" ] && grep -xF "$PREFERRED" "$RUNNER_TEMP/keys-head.txt" "$RUNNER_TEMP/keys-base.txt" -h | head -1
            cat "$RUNNER_TEMP/keys-head.txt" "$RUNNER_TEMP/keys-base.txt"; } \
            | grep -E '^[a-z0-9_]+$' | awk '!seen[$0]++' > "$RUNNER_TEMP/keys.txt"
          head -n "$MAX_SOURCES" "$RUNNER_TEMP/keys.txt" > "$RUNNER_TEMP/run.txt"
          tail -n +"$((MAX_SOURCES + 1))" "$RUNNER_TEMP/keys.txt" | tr '\n' ' ' > raw/over_limit.txt
          while IFS= read -r key; do
            for side in base head; do
              grep -qxF "$key" "$RUNNER_TEMP/keys-$side.txt" || continue
              ( cd "$side/scraper" && timeout 300 python main.py --dry-run --source "$key" \
                  > "$RUNNER_TEMP/out" 2> "$RUNNER_TEMP/err" ); rc=$?
              head -c 50000000 "$RUNNER_TEMP/out" > "raw/$key.$side.out"
              tail -c 200000 "$RUNNER_TEMP/err" > "raw/$key.$side.err"
              echo "$rc" > "raw/$key.$side.rc"
            done
          done < "$RUNNER_TEMP/run.txt"
          ls raw

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dryrun-raw
          path: raw/
          retention-days: 7
          if-no-files-found: warn

  comment:
    needs: [files, dryrun]
    if: always() && needs.files.result == 'success' && (needs.files.outputs.modules != '' || needs.files.outputs.shared != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the default branch (never the PR)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dryrun-raw
          path: raw

      - name: Render and post the evidence comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHARED: ${{ needs.files.outputs.shared }}
          DRYRUN_RESULT: ${{ needs.dryrun.result }}
        run: |
          set -euo pipefail
          mkdir -p res raw
          for rc in raw/*.rc; do
            [ -e "$rc" ] || continue
            stem=$(basename "$rc" .rc)
            [[ "$stem" =~ ^[a-z0-9_]+\.(base|head)$ ]] || continue
            n=$(head -c 6 "$rc" | tr -cd '0-9'); n=${n:-1}
            python3 scripts/ci/dryrun_evidence.py summarize --out "raw/$stem.out" --err "raw/$stem.err" \
              --rc "$n" --json-output "res/$stem.json"
          done
          note=""
          over=$(head -c 500 raw/over_limit.txt 2>/dev/null | tr -cd 'a-z0-9_ ' || true)
          [ -n "${over// /}" ] && note="超過 $MAX_SOURCES 個來源，未跑：$over。"
          [ -n "$SHARED" ] && note="$note共用模組 $SHARED 影響多個來源，未測。"
          [ "$DRYRUN_RESULT" = "success" ] || note="dry-run job 結果：$DRYRUN_RESULT。$note"
          python3 scripts/ci/dryrun_evidence.py render --results-dir res --pr "$PR" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --skipped "$note" --output body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          # Update our own earlier comment instead of adding one per push.
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-dryrun-evidence -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
