name: External Stats Pull

on:
  # Run on the 25th of each month at 22:00 JST (13:00 UTC)
  # MOJ ISA publishes ~3 months after survey end; JNTO publishes monthly
  schedule:
    - cron: "0 13 25 * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source to pull (leave blank for all)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - jnto
          - moj
          - population
      dry_run:
        description: "Dry run (no DB writes)"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Pull external stats
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          ARGS=""
          if [ -n "$SOURCE" ]; then
            ARGS="$ARGS --source $SOURCE"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python external_stats/pull_all.py $ARGS
