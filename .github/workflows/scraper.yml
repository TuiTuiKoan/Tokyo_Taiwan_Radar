name: Daily Scraper

on:
  # Run every day at 09:00 JST (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Also allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summarize.outputs.summary }}
      annotate_outcome: ${{ steps.run_scraper.outcome }}
      backlog_health: ${{ steps.backlog.outputs.json }}
      quality_alert: ${{ steps.quality.outputs.alert }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        id: run_scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_ANNOTATOR: ${{ secrets.OPENAI_API_KEY_ANNOTATOR }}
          OPENAI_API_KEY_ENRICH: ${{ secrets.OPENAI_API_KEY_ENRICH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: python main.py
        # LLM steps keep going on failure so the non-LLM steps below still run;
        # "Fail on LLM step errors" at the end turns the job red (#319).
        continue-on-error: true

      - name: Run merger (cross-source deduplication)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python merger.py

      - name: Fix reviewed events missing translations
        id: fix_reviewed
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_ANNOTATOR: ${{ secrets.OPENAI_API_KEY_ANNOTATOR }}
          OPENAI_API_KEY_ENRICH: ${{ secrets.OPENAI_API_KEY_ENRICH }}
        run: python annotator.py --fix-reviewed
        continue-on-error: true

      # annotate, movie-title and person-name enrichment run once, inside main.py (#361).

      - name: Enrich missing location addresses via GPT
        id: enrich_location
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_ANNOTATOR: ${{ secrets.OPENAI_API_KEY_ANNOTATOR }}
          OPENAI_API_KEY_ENRICH: ${{ secrets.OPENAI_API_KEY_ENRICH }}
        run: python enrich_location.py
        continue-on-error: true

      - name: Enrich venue addresses from the venue registry and sibling events
        # No LLM since 2026-10 (#318): gpt-4o-search-preview was retired ~2026-08-20.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: scraper
        run: python enrich_addresses.py

      - name: Backfill location_prefectures after address enrichment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: scraper
        run: python backfill_location_prefectures.py --apply

      - name: Geocode events
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YAHOO_GEOCODER_APPID: "${{ secrets.YAHOO_GEOCODER_APPID }}"
        run: python geocode_events.py --limit 50
        continue-on-error: true

      - name: Run merger (post-annotation deduplication)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python merger.py

      - name: Auto-QA reconcile (close resolved reports)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python auto_qa.py --reconcile
        continue-on-error: true

      - name: Auto-QA scan (writes event_reports)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python auto_qa.py
        continue-on-error: true

      - name: Backlog health snapshot
        id: backlog
        if: always()
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          HEALTH=$(python backlog_health.py)
          echo "json=$HEALTH" >> $GITHUB_OUTPUT
          echo "## \ud83d\udcca Backlog Health" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$HEALTH" | python -m json.tool >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          STATUS=$(echo "$HEALTH" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))")
          if [ "$STATUS" != "ok" ]; then
            echo "::warning::Backlog status=$STATUS — check LINE notification for details"
          fi

      - name: Source exclusions maintenance
        if: always()
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          OUT=$(python exclusions_maintenance.py)
          echo "## 🛡️ Source Exclusions Maintenance" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$OUT" | python -m json.tool >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Daily quality metrics
        id: quality
        if: always()
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          OUT=$(python daily_quality.py)
          echo "## 📈 Daily Quality Metrics" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$OUT" | python -m json.tool >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ALERT=$(echo "$OUT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('alert') or '')")
          if [ -n "$ALERT" ]; then
            echo "::warning::$ALERT"
          fi
          echo "alert=$ALERT" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Summarize run
        id: summarize
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SUMMARY=$(python summarize_run.py)
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Fail on LLM step errors
        # The LLM steps above use continue-on-error so the rest of the pipeline
        # runs. A retired model, bad key or exhausted quota makes them exit
        # non-zero (scraper/llm_client.py); fail the job here so it shows (#319).
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.run_scraper.outcome }}" = "failure" ] && FAILED="$FAILED main.py"
          [ "${{ steps.fix_reviewed.outcome }}" = "failure" ] && FAILED="$FAILED fix-reviewed"
          [ "${{ steps.enrich_location.outcome }}" = "failure" ] && FAILED="$FAILED enrich-location"
          if [ -n "$FAILED" ]; then
            echo "::error::LLM steps failed:$FAILED"
            echo "## ❌ LLM steps failed:$FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  validate:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    outputs:
      warnings: ${{ steps.check.outputs.warnings }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Validate scraper results
        id: check
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python validate.py || true
          WARNINGS=$(cat /tmp/warnings.json 2>/dev/null || echo '{}')
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

  notify:
    needs: [scrape, validate]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Send LINE notification
        working-directory: scraper
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SCRAPE_SUMMARY: ${{ needs.scrape.outputs.summary }}
          VALIDATE_WARNINGS: ${{ needs.validate.outputs.warnings }}
          ANNOTATE_OUTCOME: ${{ needs.scrape.outputs.annotate_outcome }}
          BACKLOG_HEALTH: ${{ needs.scrape.outputs.backlog_health }}
          QUALITY_ALERT: ${{ needs.scrape.outputs.quality_alert }}
        run: python notify.py
