name: Daily Scraper

on:
  # Run every day at 09:00 JST (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Also allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summarize.outputs.summary }}
      annotate_outcome: ${{ steps.annotate_pending.outcome }}
      backlog_health: ${{ steps.backlog.outputs.json }}
      quality_alert: ${{ steps.quality.outputs.alert }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
          CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: python main.py

      - name: Run merger (cross-source deduplication)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python merger.py

      - name: Annotate pending events
        id: annotate_pending
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python annotator.py --limit 500
        continue-on-error: true

      - name: Flag annotate failure
        if: steps.annotate_pending.outcome != 'success'
        run: |
          echo "::warning::Annotate step failed (outcome=${{ steps.annotate_pending.outcome }}). Backlog may not have been drained."
          echo "## \u26a0\ufe0f Annotate Failed" >> $GITHUB_STEP_SUMMARY
          echo "Outcome: \`${{ steps.annotate_pending.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Pending backlog\u6d88\u5316\u672a\u57f7\u884c\uff0c\u8acb\u53c3\u8003\u4e0b\u65b9 Backlog Health \u5340\u584a\u3002" >> $GITHUB_STEP_SUMMARY

      - name: Fix reviewed events missing translations
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python annotator.py --fix-reviewed

      - name: Enrich movie titles from eiga.com + TMDB
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python annotator.py --enrich-movie-titles

      - name: Enrich person names via eiga.com + Wikipedia (all events)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python annotator.py --enrich-person-names

      - name: Run Vision OCR enrichment
        working-directory: scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python enrich_poster.py

      - name: Enrich missing location addresses via GPT
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python enrich_location.py
        continue-on-error: true

      - name: Run merger (post-annotation deduplication)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python merger.py

      - name: Auto-QA scan (writes event_reports)
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python auto_qa.py
        continue-on-error: true

      - name: Backlog health snapshot
        id: backlog
        if: always()
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          HEALTH=$(python backlog_health.py)
          echo "json=$HEALTH" >> $GITHUB_OUTPUT
          echo "## \ud83d\udcca Backlog Health" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$HEALTH" | python -m json.tool >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          STATUS=$(echo "$HEALTH" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))")
          if [ "$STATUS" != "ok" ]; then
            echo "::warning::Backlog status=$STATUS — check LINE notification for details"
          fi

      - name: Source exclusions maintenance
        if: always()
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          OUT=$(python exclusions_maintenance.py)
          echo "## 🛡️ Source Exclusions Maintenance" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$OUT" | python -m json.tool >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Daily quality metrics
        id: quality
        if: always()
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          OUT=$(python daily_quality.py)
          echo "## 📈 Daily Quality Metrics" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$OUT" | python -m json.tool >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ALERT=$(echo "$OUT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('alert') or '')")
          if [ -n "$ALERT" ]; then
            echo "::warning::$ALERT"
          fi
          echo "alert=$ALERT" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Summarize run
        id: summarize
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SUMMARY=$(python summarize_run.py)
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

  validate:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    outputs:
      warnings: ${{ steps.check.outputs.warnings }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Validate scraper results
        id: check
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python validate.py || true
          WARNINGS=$(cat /tmp/warnings.json 2>/dev/null || echo '{}')
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

  notify:
    needs: [scrape, validate]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Send LINE notification
        working-directory: scraper
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SCRAPE_SUMMARY: ${{ needs.scrape.outputs.summary }}
          VALIDATE_WARNINGS: ${{ needs.validate.outputs.warnings }}
          ANNOTATE_OUTCOME: ${{ needs.scrape.outputs.annotate_outcome }}
          BACKLOG_HEALTH: ${{ needs.scrape.outputs.backlog_health }}
          QUALITY_ALERT: ${{ needs.scrape.outputs.quality_alert }}
        run: python notify.py
