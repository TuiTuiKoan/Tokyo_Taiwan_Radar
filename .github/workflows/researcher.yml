name: Daily Research

on:
  schedule:
    # Slot 0: 06:00 JST (21:00 UTC prev day) — 映像・アート・音楽  5×/week (Mon–Fri JST = Sun–Thu UTC)
    - cron: "0 21 * * 0-4"
    # Slot 1: 12:00 JST (03:00 UTC) — 食・書籍・テック  7×/week (daily)
    - cron: "0 3 * * *"
    # Slot 2: 18:00 JST (09:00 UTC) — 学術・地政・社会  3×/week (Tue/Thu/Sat JST = Mon/Wed/Fri UTC)
    - cron: "0 9 * * 1,3,5"
    # Slot 3: 00:00 JST (15:00 UTC) — コミュニティ・関西・福岡  7×/week (daily)
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run (0=06JST 1=12JST 2=18JST 3=24JST)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Determine slot from schedule
        id: slot
        run: |
          # Manual dispatch with explicit slot
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "value=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Map cron schedule expression → slot using github.event.schedule.
          # This is immune to GitHub Actions queue delays: even if the job starts
          # hours late, the triggering cron expression is fixed.
          #
          # cron "0 21 * * 0-4" → slot 0 (06:00 JST, Mon–Fri) — cinema / art / music
          # cron "0  3 * * *"   → slot 1 (12:00 JST, daily)    — food / books / tech
          # cron "0  9 * * 1,3,5" → slot 2 (18:00 JST, Tue/Thu/Sat) — academic / geopolitics / gender
          # cron "0 15 * * *"   → slot 3 (00:00 JST, daily)    — community / kansai / fukuoka
          SCHEDULE="${{ github.event.schedule }}"
          case "$SCHEDULE" in
            "0 21 * * 0-4")   echo "value=0" >> $GITHUB_OUTPUT ;;
            "0 3 * * *")      echo "value=1" >> $GITHUB_OUTPUT ;;
            "0 9 * * 1,3,5")  echo "value=2" >> $GITHUB_OUTPUT ;;
            "0 15 * * *")     echo "value=3" >> $GITHUB_OUTPUT ;;
            *)                echo "value=0" >> $GITHUB_OUTPUT ;;  # workflow_dispatch fallback
          esac

      - name: Run daily research
        working-directory: scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RESEARCH_SLOT: ${{ steps.slot.outputs.value }}
        run: python researcher.py