name: Quota Monitor

on:
  # Daily 03:00 JST (18:00 UTC) — between daily-dev-report (17:00) and scraper (00:00)
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      always_notify:
        description: "Send LINE even when below threshold (for testing)"
        required: false
        default: "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run quota monitor
        working-directory: scraper
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_REPO: "${{ github.repository }}"
          VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
          VERCEL_PROJECT_ID: "${{ vars.VERCEL_PROJECT_ID }}"
          VERCEL_TEAM_ID: "${{ vars.VERCEL_TEAM_ID }}"
          LINE_CHANNEL_TOKEN: "${{ secrets.LINE_CHANNEL_TOKEN }}"
          LINE_USER_ID: "${{ secrets.LINE_USER_ID }}"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.always_notify }}" = "true" ]; then
            ARGS="--always"
          fi
          python quota_monitor.py $ARGS
