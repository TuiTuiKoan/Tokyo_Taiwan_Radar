name: Auto Update Docs

on:
  schedule:
    - cron: "0 17 * * *"   # 02:00 JST (17:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print blocks, no commit)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run update_docs.py
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          python update_docs.py $FLAGS

      - name: Commit and push if changed
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md docs/SCRAPER_PIPELINE.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(auto): update system status [skip ci]"
            git push
          fi
