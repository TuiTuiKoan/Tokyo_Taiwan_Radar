name: Scraper Tests

# Offline unit tests for scraper/ (issue #572). Before this workflow no CI job ran
# scraper/tests, so a PR that touched scraper code could only report "pytest not run".
#
# Safety:
# - Read-only token, no secrets, no Supabase/OpenAI credentials: tests must pass
#   offline. Code paths that need a database (for example Peatix organizer groups)
#   are covered by mocking, not by credentials.
# - Playwright browsers are not installed; the tests do not launch one.
# - Making this check required for merging is a repository ruleset change (human gate)
#   and is intentionally not done here.

on:
  pull_request:
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-tests.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scraper-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the PR
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper tests
        working-directory: scraper
        run: python -m pytest tests -q -p no:cacheprovider
