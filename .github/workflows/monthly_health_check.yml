name: Monthly Feedback-Loop Health Check

on:
  # Run on the 1st of each month at 09:00 JST (00:00 UTC)
  schedule:
    - cron: "0 0 1 * *"
  # Allow manual trigger (e.g., before month-end review)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: monthly-health-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health_check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Sync to latest main
        if: github.ref == 'refs/heads/main'
        run: git pull --ff-only origin main

      - name: Run monthly health check and send LINE notification
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          OUT=$(python monthly_health_check.py)
          echo "## 📋 Monthly Feedback-Loop Health Check" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$OUT" | python -m json.tool >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          FLAGS=$(echo "$OUT" | python -c "import sys,json; d=json.load(sys.stdin); flags=d.get('integrity_flags',[]); print('\n'.join(flags) if flags else '')" 2>/dev/null || true)
          if [ -n "$FLAGS" ]; then
            echo "::warning::$FLAGS"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 📌 下一步：月度治理復盤" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "收到 LINE 報告後，請在 VS Code 中呼叫 **Reviewer agent** 進行深度分析：" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "1. 開啟 VS Code Copilot Chat" >> $GITHUB_STEP_SUMMARY
          echo '2. 選擇 Agent: "Reviewer"' >> $GITHUB_STEP_SUMMARY
          PREV_MONTH=$(TZ=Asia/Tokyo date -d "$(TZ=Asia/Tokyo date +%Y-%m-01) -1 day" +%Y-%m)
          echo "3. 輸入：請進行本月治理復盤，分析爬蟲健康、Skills 新鮮度與 Agent scope overlap。上月（${PREV_MONTH}）數據型月報已由 docs_report.py 自動生成於 docs/monthly_review/${PREV_MONTH}.md，請在其基礎上補充深度治理分析。" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate monthly docs report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper/docs_report.py --mode monthly

      - name: Commit & push monthly report
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain docs/monthly_review/)" ]; then
            echo "No monthly report changes to commit (idempotent no-op)"
            exit 0
          fi
          CHANGED=$(git status --porcelain docs/monthly_review/ | awk '{print $NF}' | head -1)
          KEY=$(basename "$CHANGED" .md)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/monthly_review/
          git commit -m "docs(monthly_review): ${KEY} monthly review"
          n=0
          until git push origin HEAD:main; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::monthly report push failed after ${n} attempts"
              exit 1
            fi
            echo "::warning::push rejected (attempt ${n}); rebasing onto origin/main"
            git fetch origin main && git rebase origin/main || {
              echo "::error::rebase conflict on monthly report; manual intervention required"
              exit 1
            }
          done

      - name: Run SKILL.md scanner
        working-directory: scraper
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          OUT=$(python skill_scanner.py 2>/dev/null)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 🔍 SKILL.md Scanner" >> $GITHUB_STEP_SUMMARY
          echo "$OUT" >> $GITHUB_STEP_SUMMARY

      - name: Commit scan report
        if: success()
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$(git status --porcelain docs/skill_scan/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/skill_scan/
            git commit -m "chore(governance): monthly SKILL.md scan report $(date +%Y-%m)"
            n=0
            until git push origin HEAD:main; do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then echo "::error::scan report push failed after ${n} attempts"; exit 1; fi
              echo "::warning::push rejected (attempt ${n}); rebasing onto origin/main"
              git fetch origin main && git rebase origin/main || { echo "::error::rebase conflict on scan report"; exit 1; }
            done
          else
            echo "No scan report changes to commit (or not on main)"
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Reviewer agent 為唯讀分析，不修改程式碼。詳見 \`.github/agents/reviewer.agent.md\`" >> $GITHUB_STEP_SUMMARY

      - name: Run monthly annotator baseline
        working-directory: scraper
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
        run: |
          MONTH=$(date +%Y-%m-01)
          mkdir -p ../docs/evaluation/annotator
          python eval_annotator.py --output "../docs/evaluation/annotator/${MONTH}-monthly.md" || echo "No cases yet, skipping baseline"
          if [ -f "../docs/evaluation/annotator/${MONTH}-monthly.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "## Annotator Baseline ${MONTH}" >> $GITHUB_STEP_SUMMARY
            head -30 "../docs/evaluation/annotator/${MONTH}-monthly.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit monthly evaluation outputs
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$(git status --porcelain docs/evaluation/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/evaluation/
            git commit -m "chore(evaluation): monthly annotator baseline $(date +%Y-%m)"
            n=0
            until git push origin HEAD:main; do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then echo "::error::evaluation push failed after ${n} attempts"; exit 1; fi
              echo "::warning::push rejected (attempt ${n}); rebasing onto origin/main"
              git fetch origin main && git rebase origin/main || { echo "::error::rebase conflict on evaluation outputs"; exit 1; }
            done
          else
            echo "No evaluation changes to commit (or not on main)"
          fi

