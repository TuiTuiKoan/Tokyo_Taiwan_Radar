name: Monthly Feedback-Loop Health Check

on:
  # Run on the 1st of each month at 09:00 JST (00:00 UTC)
  schedule:
    - cron: "0 0 1 * *"
  # Allow manual trigger (e.g., before month-end review)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run monthly health check and send LINE notification
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          OUT=$(python monthly_health_check.py)
          echo "## 📋 Monthly Feedback-Loop Health Check" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$OUT" | python -m json.tool >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          FLAGS=$(echo "$OUT" | python -c "import sys,json; d=json.load(sys.stdin); flags=d.get('integrity_flags',[]); print('\n'.join(flags) if flags else '')" 2>/dev/null || true)
          if [ -n "$FLAGS" ]; then
            echo "::warning::$FLAGS"
          fi
