name: Auto Research

on:
  schedule:
    - cron: "30 15 * * 3"   # 週四 00:30 JST (UTC+9: Wed 15:30 UTC) — 每週一次降低成本
  workflow_dispatch:
    inputs:
      source_id:
        description: "Single source_id to assess (leave blank for --batch)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no DB writes)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  auto-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run auto research
        working-directory: scraper
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          if [ -n "${{ github.event.inputs.source_id }}" ]; then
            FLAGS="--source-id ${{ github.event.inputs.source_id }}"
          else
            FLAGS="--batch --create-issue"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          python -m auto_scraper.auto_research $FLAGS
