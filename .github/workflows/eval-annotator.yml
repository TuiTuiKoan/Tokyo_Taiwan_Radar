name: Annotator Golden Set Eval

on:
  pull_request:
    paths:
      - 'scraper/annotator.py'
      - 'scraper/category_feedback.py'
      - 'scraper/selection_reason_feedback.py'
      - 'scraper/tests/golden/**'
      - 'scraper/eval_annotator.py'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run golden set eval (Stage 1, frozen mode)
        working-directory: scraper
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
        run: |
          python eval_annotator.py \
            --stage 1 \
            --output report.md \
            --json-output eval_snapshot.json \
            || echo "No cases yet, skipping eval"
          if [ -f "report.md" ]; then
            echo "## Annotator Golden Set Report (Stage 1)" >> $GITHUB_STEP_SUMMARY
            cat report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Enforce Stage 1 KPI (PR only)
        if: github.event_name == 'pull_request' && hashFiles('scraper/eval_snapshot.json') != ''
        working-directory: scraper
        run: |
          python -c "
          import json, sys
          snap = json.load(open('eval_snapshot.json'))
          per_field = snap.get('per_field', {})
          nz = per_field.get('name_zh', {})
          passed = nz.get('passed', 0)
          tested = nz.get('tested', 0)
          # Stage 1 baseline: name_zh >= 1/14 (LLM-only, pre-pipeline).
          # Tightened thresholds live in eval-annotator-stage2.yml.
          if tested > 0 and passed < 1:
              sys.exit(f'Stage 1 KPI regression: name_zh {passed}/{tested} < 1 baseline')
          print(f'Stage 1 KPI passed: name_zh {passed}/{tested}')
          "

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && hashFiles('scraper/report.md') != ''
        with:
          path: scraper/report.md

      - uses: actions/upload-artifact@v4
        if: hashFiles('scraper/report.md') != ''
        with:
          name: eval-report-stage1
          path: |
            scraper/report.md
            scraper/eval_snapshot.json
