name: Venue Pipeline Eval

# #325 — location pipeline eval, scored stage by stage (see scraper/eval_venues.py).
# - resolve: location_name → authoritative venue against the frozen registry
#   snapshot. No secrets; the baseline gate fails the PR on fewer correct cases
#   or on any wrong venue.
# - extract: raw text → location_name through the annotator LLM. Reads raw text
#   from the DB (read-only) and calls OpenAI (~38 calls). Report only, no gate:
#   single runs vary by a case or two.

on:
  pull_request:
    paths:
      - 'scraper/venue_registry.py'
      - 'scraper/annotator.py'
      - 'scraper/eval_venues.py'
      - 'scraper/eval_annotator.py'
      - 'scraper/tests/golden/venues.jsonl'
      - 'scraper/tests/golden/venue_registry_snapshot.json'
      - 'scraper/tests/golden/venues_manifest.json'
      - '.github/workflows/eval-venues.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run resolve + extract (report)
        working-directory: scraper
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
        run: |
          python eval_venues.py --stage all \
            --output venues_report.md \
            --json-output venues_snapshot.json
          echo "## Venue Pipeline Eval" >> "$GITHUB_STEP_SUMMARY"
          cat venues_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce resolve baseline
        working-directory: scraper
        run: python eval_venues.py --stage resolve --enforce-baseline --output /tmp/venues_gate.md

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        if: always() && github.event_name == 'pull_request' && hashFiles('scraper/venues_report.md') != ''
        with:
          header: eval-venues
          path: scraper/venues_report.md

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('scraper/venues_report.md') != ''
        with:
          name: eval-venues
          path: |
            scraper/venues_report.md
            scraper/venues_snapshot.json
