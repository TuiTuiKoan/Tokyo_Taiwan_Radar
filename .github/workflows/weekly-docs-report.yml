name: Weekly Docs Report

on:
  schedule:
    # Primary: Monday 00:10 JST (Sunday 15:10 UTC) — previous complete Mon–Sun week
    - cron: "10 15 * * 0"
    # Fallback: Monday 00:40 JST (Sunday 15:40 UTC) — idempotent no-op if primary already ran
    - cron: "40 15 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional week-ending date (YYYY-MM-DD); snaps to that week's Sunday. Blank = previous complete week."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-docs-report-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  weekly_report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main (full history for git inventory)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Sync to latest main
        if: github.ref == 'refs/heads/main'
        run: git pull --ff-only origin main

      - name: Generate weekly docs report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scraper/docs_report.py --mode weekly --date "${{ github.event.inputs.date }}"
          else
            python scraper/docs_report.py --mode weekly
          fi

      - name: Commit & push weekly report
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain docs/weekly_review/)" ]; then
            echo "No weekly report changes to commit (idempotent no-op)"
            exit 0
          fi
          CHANGED=$(git status --porcelain docs/weekly_review/ | awk '{print $NF}' | head -1)
          KEY=$(basename "$CHANGED" .md)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/weekly_review/
          git commit -m "docs(weekly_review): ${KEY} weekly review"
          n=0
          until git push origin HEAD:main; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::weekly report push failed after ${n} attempts"
              exit 1
            fi
            echo "::warning::push rejected (attempt ${n}); rebasing onto origin/main"
            git fetch origin main && git rebase origin/main || {
              echo "::error::rebase conflict on weekly report; manual intervention required"
              exit 1
            }
          done
