name: Daily Title Sync Check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      since_hours:
        description: "Lookback window in hours"
        required: false
        default: "36"
      fail_on_findings:
        description: "Fail workflow when findings exist"
        required: false
        default: "true"

jobs:
  check-title-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run title sync checker
        id: checker
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SINCE_HOURS: ${{ github.event.inputs.since_hours || '36' }}
          FAIL_ON_FINDINGS: ${{ github.event.inputs.fail_on_findings || 'true' }}
        run: |
          set +e
          mkdir -p ../artifacts
          ARGS="--since-hours ${SINCE_HOURS} --output-json ../artifacts/title-sync-findings.json"
          if [ "${FAIL_ON_FINDINGS}" = "true" ]; then
            ARGS="${ARGS} --fail-on-findings"
          fi

          python check_title_sync_mismatch.py ${ARGS} | tee ../artifacts/title-sync-check.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload title sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-sync-check-${{ github.run_id }}
          path: |
            artifacts/title-sync-check.log
            artifacts/title-sync-findings.json

      - name: Fail when findings exist
        if: steps.checker.outputs.exit_code != '0'
        run: |
          echo "Title sync mismatch findings detected. See artifacts."
          exit 1
