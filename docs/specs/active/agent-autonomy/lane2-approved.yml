# Lane 2 核准清單（agent-autonomy proposal §9，Phase D5）
#
# main 上這個檔案裡的條目，就是使用者核准 lane2 runner 實作的範圍。
# - 核准的分量和「合併 PR 到 main」相同：檔案只能經 tier 2 PR、由使用者按合併
#   進入 main。這道關卡目前只有文字規則（見 proposal §9 前提 1），補強之前不啟用 runner。
# - runner 只讀 main 上的這個檔，並逐條追到合併它的 PR（只改這個檔、帶 lane2-proposal）；
#   不讀 issue label 或留言（agent 能偽造）。請一律經 PR 編輯，不要直接 commit 到 main。
#
# 怎麼核准（每週六）：
#   打開「approve(lane2): 週次 YYYY-Www」PR → Files changed → 右上角 … → Edit file。
#   - 不核准的條目：從該條目的「- issue:」那一行，刪到下一個「- issue:」之前（或檔尾）。
#   - 需要你決定的條目：在 answer: 後面填你的答案（空白＝不做）。
#   - 改完按 Commit changes，再按 Merge。不合併＝這週不核准任何事。
#
# 緊急停止：把 paused 改成 true 並合併。恢復時改回 false，並把 resume_after 設成當天
# （停止條件只計算這天之後的 PR）。
#
# 條目欄位：
#   issue      issue 編號
#   type       implement（新來源評估不需核准，不寫在這裡）
#   scope      做法一句話；runner 不得超出
#   files      預計改的檔案；必須改清單外的檔就停下留言。禁止路徑（proposal §9）不能靠這裡放寬
#   suggested  agent 建議的答案（可省略）
#   answer     使用者的答案。標了 judgement: true 的條目，answer 空白時不做
#   judgement  true＝範圍判斷、分類定義、annotation／ground truth 這類人類判斷
#   risk       low / medium / high（agent 的估計）
#   week       提案週次，例：2026-W46
#
# 範例（註解內，不生效）：
#   - issue: 540
#     type: implement
#     scope: external_stats_pull 的 upsert 指定 on_conflict，修正每月失敗
#     files: [scraper/external_stats_pull.py, scraper/tests/test_external_stats_pull.py]
#     suggested: "衝突鍵用 (source, period)"
#     answer: "同意"
#     judgement: false
#     risk: low
#     week: 2026-W46

version: 1
paused: true          # 前提 1–4 完成、使用者建立排程後，由使用者改成 false
resume_after: null
entries: []
