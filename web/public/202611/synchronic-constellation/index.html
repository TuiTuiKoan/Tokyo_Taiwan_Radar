<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>共時的星叢 クイックガイド｜Synchronic Constellation Guide (JA/EN)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6F0; --card:#fffdf9; --ink:#1d1d24; --sub:#5c5b63; --mute:#6f6e75;
  --line:#e2ded5; --accent:#2b3a8c; --accent-soft:#e7e9f6; --star:#c69a3a;
  --deep:#0F3F34; --brown:#5A3A1A; --cream:#F5F0E8; --pink:#F0B0B0;
  /* 章別 badge：各章節色票 */
  --c0:#F0B0B0; --c1:#19564F; --c2:#D8B07A; --c3:#BFCB4A; --c4:#F8D5D5; --c5:#9F5C2B; --c6:#CACACA;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans JP",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:16px;line-height:1.9;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 56px}

/* header */
.hero{position:relative;padding:34px 0 22px;overflow:hidden}

.kicker{font-size:12px;letter-spacing:.14em;color:var(--sub);margin:0 0 10px}
.title{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;font-weight:900;font-size:36px;line-height:1.25;margin:0;letter-spacing:.02em}
.subtitle{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;font-weight:700;font-size:15px;margin:10px 0 0;color:var(--ink);line-height:1.7}
.en{font-size:12px;color:var(--mute);margin:6px 0 0;letter-spacing:.02em}
.meta{font-size:12.5px;color:var(--sub);margin:14px 0 0}

/* search */
.searchbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 12px;margin:0 -18px;padding-left:18px;padding-right:18px;
  padding-top:calc(10px + env(safe-area-inset-top));}
.sbox{display:flex;align-items:center;gap:8px;background:var(--pink);border:1.5px solid var(--pink);border-radius:14px;padding:0 6px 0 14px;height:52px;transition:box-shadow .15s}
.sbox:focus-within{box-shadow:0 0 0 4px rgba(240,176,176,.45)}
.sbox svg{flex:none;width:20px;height:20px;color:var(--ink)}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);height:100%}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.sbox input::placeholder{color:rgba(29,29,36,.6);font-size:15px}
.clear{flex:none;border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:none;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.clear.show{display:flex}
.hint{font-size:12.5px;color:var(--sub);margin:8px 2px 0}
.hint b{font-weight:500;color:var(--ink)}

/* sections */
.sec{margin-top:26px}
.sec h2{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--sub);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec h2 .n{font-weight:500;letter-spacing:0;color:var(--mute)}

.chapters{display:grid;gap:8px}
.chap{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;min-height:60px}
.chap .no{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.chap .nm{flex:1;min-width:0;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;font-weight:700;font-size:15.5px;line-height:1.5}
.chap .nm small{display:block;font-family:"Noto Sans JP",sans-serif;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px}
.chap .ct{flex:none;font-size:12px;color:var(--sub)}
.chap.off{opacity:.55;pointer-events:none}
.chap .arr{flex:none;display:inline-flex;color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;line-height:1.3}
.chip span{color:var(--c5);font-size:12px;margin-left:4px}

.note{font-size:12.5px;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:26px}
.note p{margin:0 0 6px}.note p:last-child{margin:0}

/* result list */
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.item{display:flex;gap:12px;padding:12px 14px;text-decoration:none;align-items:flex-start}
.item:active{background:var(--accent-soft)}
.item .id{flex:none;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;letter-spacing:.02em;padding-top:2px;min-width:74px;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.item .body{flex:1;min-width:0}
.item .t{display:block;font-weight:700;font-size:15px;line-height:1.35;word-break:break-word}
.item .s{display:block;font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.5}
mark{background:#f3e3b5;color:inherit;border-radius:2px;padding:0 1px}
.empty{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 16px;font-size:14.5px;color:var(--sub)}
.empty b{color:var(--ink)}
.idb{display:inline-block;color:#fff;font-weight:500;font-size:13px;line-height:1.5;padding:2px 10px;border-radius:999px;letter-spacing:.02em}

/* detail */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 0 6px;position:sticky;top:0;background:var(--paper);z-index:5}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:8px 8px 8px 0;font-size:15px;cursor:pointer;text-decoration:none}
.pn{display:flex;gap:6px}
.pn a{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none}
.pn a.dis{opacity:.35;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 12px 5px 5px;color:#fff;font-size:13px;font-weight:500;line-height:1.3;text-decoration:none}
.badge .bn{background:rgba(255,255,255,.22);border-radius:999px;padding:2px 9px;font-weight:700}
.did{font-variant-numeric:tabular-nums;font-size:13px;color:var(--sub);letter-spacing:.08em;margin:18px 0 4px}
.did strong{font-size:30px;color:var(--ink);letter-spacing:.04em;font-weight:700;display:block;line-height:1.2}
.dtitle{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;font-weight:900;font-size:21px;line-height:1.3;margin:14px 0 18px;word-break:break-word}
.fields{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0;padding:4px 16px}
.f{display:grid;grid-template-columns:7.2em 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.f:first-child{border-top:0}
.f dt{font-size:12.5px;color:var(--sub);padding-top:2px}
.f dd{margin:0;font-size:15px;word-break:break-word}
.f dd .na{color:var(--mute)}
.alink{display:inline;border:0;background:none;padding:0;color:var(--c5);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:pointer;font:inherit}
.fn{font-size:12px;color:var(--sub);margin:10px 2px 0}
.related{margin-top:26px}

.foot{margin-top:40px;font-size:11.5px;color:var(--mute);line-height:1.7}
.foot a{color:var(--c5);text-underline-offset:3px;text-decoration-thickness:1.5px}

.item .s{display:block}
.kt{display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.06em;border-radius:4px;padding:0 6px;line-height:1.7;margin-left:0}
.kw,.kd{background:transparent;color:var(--brown);border:1px solid var(--brown)}
.zh{display:block;font-size:13.5px;color:var(--sub);margin-top:2px}
.rd{display:block;font-size:12.5px;color:var(--mute)}
.ztitle{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;font-size:15px;color:var(--sub);margin:-10px 0 16px}
.period{display:inline-block;font-size:12.5px;font-weight:500;color:#8a3b1f;background:#f6e3d8;border-radius:6px;padding:2px 10px;margin:-6px 0 16px}
.tabs{display:flex;gap:6px;margin-top:20px;background:#ebe7de;border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;height:40px;font-size:14.5px;font-weight:500;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sm{font-size:12.5px}
.hint.lead{margin-top:0}

.hero .stars{position:absolute;right:-20px;top:34px;width:190px;height:150px;opacity:.9;pointer-events:none}
.hero .lang{position:relative;z-index:2;margin:0 0 18px auto;width:max-content}
.lang{display:inline-flex;background:#ebe7de;border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;min-height:32px}
.lang button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.lang.compact button{padding:4px 9px;font-size:12px;min-height:30px}
.navr{display:flex;align-items:center;gap:8px}
.en-title{font-size:31px;letter-spacing:.01em;line-height:1.2}
.hero .title,.hero .subtitle{position:relative;z-index:1}
html[lang=en] .hero .stars{opacity:.45;top:60px}

button.item,button.chap,button.badge,button.back{font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:rgba(43,58,140,.08)}
button.item{width:100%;border:0;background:transparent}
button.chap{width:100%}
button.badge{border:0;color:#fff}
button.back{border:0;background:transparent}
.pn button{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;line-height:0;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;color:var(--ink)}
.pn button svg{display:block}
.pn button:disabled{opacity:.35;cursor:default}

.no[style*="var(--c0)"],.no[style*="var(--c2)"],.no[style*="var(--c3)"],.no[style*="var(--c4)"],.no[style*="var(--c6)"],.idb[style*="var(--c0)"],.idb[style*="var(--c2)"],.idb[style*="var(--c3)"],.idb[style*="var(--c4)"],.idb[style*="var(--c6)"],.badge[style*="var(--c0)"],.badge[style*="var(--c2)"],.badge[style*="var(--c3)"],.badge[style*="var(--c4)"],.badge[style*="var(--c6)"]{color:var(--deep)}
.badge[style*="var(--c0)"] .bn,.badge[style*="var(--c2)"] .bn,.badge[style*="var(--c3)"] .bn,.badge[style*="var(--c4)"] .bn,.badge[style*="var(--c6)"] .bn{background:rgba(15,63,52,.16)}
.mt{font-size:11px;font-weight:400;color:var(--mute);margin-left:6px;white-space:nowrap;letter-spacing:0}
.mtl{font-size:12px;color:var(--mute);margin:-10px 0 14px}
html[lang=zh-Hant] body{font-family:"Noto Sans TC","Noto Sans JP",-apple-system,"PingFang TC","Hiragino Sans",sans-serif}
html[lang=zh-Hant] .dtitle,html[lang=zh-Hant] .title,html[lang=zh-Hant] .chap .nm,html[lang=zh-Hant] .subtitle,html[lang=zh-Hant] .ztitle{font-family:"Noto Sans TC","Noto Sans JP",sans-serif}
.lang button[lang=zh-Hant]{font-family:"Noto Sans TC","Noto Sans JP",sans-serif}
/* 美術館サイトに倣った黒ヘッダー：ヒーロー・固定検索バー・詳細の固定ナビ */
.hero,.searchbar,.topnav{background:#000;box-shadow:0 0 0 100vmax #000;clip-path:inset(0 -100vmax);--ink:#fff;--sub:#d6d6da;--mute:#b9b9bf;color:#fff}
.hero{margin-top:0}
.sbox,.lang,.pn a,.pn button{--ink:#1d1d24;--sub:#55545c;--mute:#6f6e75;color:var(--ink)}
</style>
</head>

/* ---------- helpers ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const VARIANTS = {"黃":"黄","賴":"頼","吳":"呉","顏":"顔","莊":"荘","啟":"啓","獻":"献","聰":"聡","鷗":"鴎","臺":"台","灣":"湾","藝":"芸","學":"学","圖":"図","會":"会","國":"国","歷":"歴","畫":"画","寫":"写","眞":"真","澤":"沢","廣":"広","樂":"楽","舊":"旧","藏":"蔵","氣":"気","與":"与","傳":"伝","團":"団","鄉":"郷","髮":"髪","歐":"欧","龜":"亀","瀧":"滝","德":"徳","觀":"観","歸":"帰","晉":"晋","稻":"稲","讚":"讃","壽":"寿","榮":"栄","曾":"曽","條":"条","戶":"戸","祿":"禄","縣":"県","變":"変","應":"応","體":"体","發":"発","萬":"万","鐵":"鉄","禮":"礼","邊":"辺","濱":"浜","亞":"亜","錄":"録","彥":"彦","劍":"剣","聲":"声","櫻":"桜","號":"号","圓":"円","雞":"鶏","對":"対","從":"従","實":"実","戰":"戦","黨":"党","齋":"斎","齊":"斉","廳":"庁"};
function norm(s){
  s = (s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").normalize("NFKC").toLowerCase();
  let o=""; for(const ch of s){ o += VARIANTS[ch] || ch; }
  return o.replace(/[\s・･·‧=＝\-‐ー–—―「」『』《》［］\[\]（）()、，,。.:：*＊'’“”"]/g,"");
}
const pad = (n,w)=>String(+n).padStart(w,"0");
function parseQuery(q){
  const s=(q||"").normalize("NFKC").trim().toUpperCase();
  let m;
  if((m=s.match(/^D\s*([1-9])\s*[-ー‐–_\s]?\s*(\d{1,3})(?:\s*[-ー‐–_]\s*(\d))?$/)))
    return {type:"doc", id:"D"+m[1]+"-"+pad(m[2],3)+(m[3]?"-"+m[3]:"")};
  if((m=s.match(/^([1-9])\s*[-ー‐–_\s]\s*(\d{3})(?:\s*[-ー‐–_]\s*(\d))?$/)))
    return {type:"doc", id:"D"+m[1]+"-"+pad(m[2],3)+(m[3]?"-"+m[3]:"")};
  if((m=s.match(/^A?\s*([0-6])\s*[-ー‐–_\s]\s*(\d{1,2})$/)) || (m=s.match(/^A\s*([0-6])(\d{2})$/)))
    return {type:"work", id:m[1]+"-"+pad(m[2],2)};
  if((m=s.match(/^D\s*([1-9])$/))) return {type:"chapter", ch:+m[1]};
  return null;
}
function splitNames(author){
  if(!author) return [];
  return author.split(/[ 　、，,]+/)
    .map(t=>t.replace(/^(作曲作詞|作曲|作詞|編曲|歌手)：/,"").replace(/(著|訳|編|装幀|設計|ら)$/,"").replace(/（.*?）/g,""))
    .filter(t=>t && !/^[A-Za-z\-\.\(\)]+$/.test(t) && t.length>=2 && t!=="作者不詳");
}
function splitNamesEn(s){

function highlight(text,q){
  text=text||""; if(!q) return esc(text);
  const chars=[...text]; const nq=norm(q); if(!nq) return esc(text);
  const map=[]; let ns="";
  chars.forEach((c,i)=>{ const n=norm(c); for(const _ of n) map.push(i); ns+=n; });
  const at=ns.indexOf(nq); if(at<0) return esc(text);
  const a=map[at], b=map[at+[...nq].length-1];
  return esc(chars.slice(0,a).join(""))+"<mark>"+esc(chars.slice(a,b+1).join(""))+"</mark>"+esc(chars.slice(b+1).join(""));
}
function itemHTML(x,q,extra){
  const c=CHAPTERS[x.ch];
  const who = x.kind==="work" ? v(x,"artist") : v(x,"author");
  const whoK = x.kind==="work" ? "artist" : "author";
  const sub=[who?highlight(who,q):"", extra?highlight(extra,q):"", esc(v(x,"year"))].filter(Boolean).join("　");
  const flag = (isAI(x,"title")||isAI(x,whoK)) ? MT : "";
  const tag = x.kind==="work" ? `<span class="kt kw">${LANG==="en"?"Work":"作品"}</span>` : `<span class="kt kd">${LANG==="en"?"Doc":"資料"}</span>`;
  return `<li><button type="button" class="item" data-go="${x.href}">
    <span class="id"><span class="idb" style="background:${c.color}">${esc(x.label)}</span>${tag}</span>
    <span class="body"><span class="t">${highlight(v(x,"title"),q)}${flag}</span>${sub?`<span class="s">${sub}</span>`:""}</span>
  </button></li>`;
}

function topArtists(n){
  const c={};

  return Object.entries(c).filter(([,k])=>k>=4).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

const H2=(label,n)=>`<h2>${label} <span class="n">${T[LANG].n(n)}</span></h2>`;
function renderResults(){
  const box=document.getElementById("results"); if(!box) return;
  const raw=query.trim();
  if(!raw){ box.innerHTML=homeIdle(); bindChips(box); return; }
  const p=parseQuery(raw);

  if(!h) h=`<section class="sec"><div class="empty">${T[LANG].noMatch(esc(raw))}</div></section>`;
  box.innerHTML=h;
}

/* ---------- shared detail parts ---------- */
const CHEV_L='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>';
const CHEV_R='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';
function topNav(prev,next,label){
  return `<nav class="topnav">
    <button type="button" class="back" data-go=""><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>${label}</button>
    <span class="navr">${langBtn(true)}
    ${prev!==undefined?`<span class="pn"><button type="button" ${prev?`data-go="${prev}"`:"disabled"} aria-label="Previous">${CHEV_L}</button><button type="button" ${next?`data-go="${next}"`:"disabled"} aria-label="Next">${CHEV_R}</button></span>`:""}</span>
  </nav>`;
}
function bindCommon(){
  app.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>{ setQuery(b.dataset.a); lastHomeScroll=0; go(""); }));
  bindLang();
}
function linkify(text,names){
  if(!text) return '<span class="na">—</span>';
  let html=esc(text);
  const ns=[...new Set(names)].sort((a,b)=>b.length-a.length);
  const ph=[];
  ns.forEach((n,i)=>{ const e=esc(n); if(e && html.includes(e)){ html=html.split(e).join(`\u0000${i}\u0000`); ph[i]=n; }});
  return html.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<button class="alink" data-a="${esc(ph[i])}">${esc(ph[i])}</button>`);
}
const namesHTML = (jp,en,zhs) => LANG==="en" && en ? linkify(en, splitNamesEn(en)) : (LANG==="zh" && zhs) ? linkify(zhs, splitNames(zhs)) : linkify(jp, splitNames(jp));
const fieldM=(k,x,f,val)=>`<div class="f"><dt>${k}</dt><dd>${val?esc(val)+mt(x,f):'<span class="na">—</span>'}</dd></div>`;
const field=(k,val,raw)=>`<div class="f"><dt>${k}</dt><dd>${raw?val:(val?esc(val):'<span class="na">—</span>')}</dd></div>`;
function badge(ch,asSpan){ const c=CHAPTERS[ch]; const tag=asSpan?"span":"a";
  const tg = asSpan?"span":"button";
  return `<${tg} class="badge" ${asSpan?"":`type="button" data-go="ch${ch}"`} style="background:${c.color}"><span class="bn">${T[LANG].chBadge(ch)}</span>${esc(chName(ch))}</${tg}>`; }
function relatedFor(names, exclude){
  const keys=[...new Set(names.map(norm))].filter(k=>k.length>=2);
  if(!keys.length) return {w:[],d:[]};
  return { w:WORKS.filter(x=>x!==exclude && keys.some(k=>x.nA.includes(k))),
           d:DOCS.filter(x=>x!==exclude && keys.some(k=>x.nA.includes(k))) };
}
function relatedHTML(r){
  let h="";
  if(r.w.length) h+=`<section class="sec">${H2(t("relW"),r.w.length)}${listHTML(r.w)}</section>`;
  if(r.d.length) h+=`<section class="sec">${H2(t("relD"),r.d.length)}${listHTML(r.d)}</section>`;
  return h;
}

/* ---------- work detail ---------- */
function renderWork(id){
  const i=workById[id], w=WORKS[i], en=LANG==="en";
  const prev=WORKS[i-1]?.href, next=WORKS[i+1]?.href;
  const zhm=LANG==="zh"; let artist=namesHTML(w.artist,w.artist_en,w.z.artist)+(zhm?mt(w,"artist"):"");
  if(!zhm && !(en && w.artist_en) && w.reading) artist+=`<span class="rd">［${esc(w.reading)}］</span>`;
  const r=relatedFor(splitNames(w.artist), w);
  const sz=v(w,"size");
  app.innerHTML=`<div class="wrap">
    ${topNav(prev||null,next||null,t("back"))}
    <article>
      <div class="did">${t("workNo")}<strong>${w.id}</strong></div>
      ${badge(w.ch)}
      <h1 class="dtitle">${esc(v(w,"title"))}${zhm&&mt(w,"title")?MT:""}</h1>
            ${w.note?`<p class="period">${esc(T[LANG].period[w.note]||w.note)}</p>`:""}
      <dl class="fields">
        ${field(t("fArtist"),artist,true)}
        ${field(t("fLife"),w.life)}
        ${fieldM(t("fYear"),w,"year",v(w,"year"))}
        ${fieldM(t("fMat"),w,"material",v(w,"material"))}
        ${field(t("fSize"),sz?sz+(/[×x]|^h\.|[：:]/.test(sz)?" cm":""):"")}
        ${fieldM(t("fColl"),w,"collection",v(w,"collection"))}
      </dl>
      ${w.title.includes("*")?`<p class="fn">${t("starNote")}</p>`:""}
    </article>
    ${relatedHTML(r)}
    ${FOOT()}
  </div>`;
  bindCommon();
}

/* ---------- doc detail ---------- */
function renderDoc(id){
  const i=docById[id], d=DOCS[i], en=LANG==="en";
  const prev=DOCS[i-1]?.href, next=DOCS[i+1]?.href;
  const ownerJa=d.owner.replace(/旧蔵※?$/,"");
  const ownerEn=(d.owner_en||"").replace(/^formerly in the collection of\s*/i,"").replace(/※/g,"").trim();
  const kome=d.owner.includes("※")?"※":"";
  const ownerZh=(d.z.owner||"").replace(/舊藏※?$/,"");
  const ownerDisp = en && ownerEn ? ownerEn : (LANG==="zh" && ownerZh) ? ownerZh : ownerJa;
  const r=relatedFor(splitNames(d.author), d);
  let ownHTML="";
  if(ownerJa){
    const k=norm(ownerJa);
    const ow=WORKS.filter(x=>x.nA.includes(k));
    const od=DOCS.filter(x=>x!==d && norm(x.owner).includes(k));
    if(ow.length) ownHTML+=`<section class="sec">${H2(esc(T[LANG].ownW(ownerDisp)),ow.length)}${listHTML(ow)}</section>`;
    if(od.length) ownHTML+=`<section class="sec">${H2(esc(T[LANG].ownD(ownerDisp)),od.length)}${listHTML(od)}</section>`;
  }
  const ownerField = d.owner ? T[LANG].ownerFmt(`<button class="alink" data-a="${esc(ownerDisp)}">${esc(ownerDisp)}</button>`, kome) : "";
  app.innerHTML=`<div class="wrap">
    ${topNav(prev||null,next||null,t("back"))}
    <article>
      <div class="did">${t("docNo")}<strong>${d.id}</strong></div>
      ${badge(d.ch)}
      <h1 class="dtitle">${esc(v(d,"title"))}${mt(d,"title")?MT:""}</h1>
      <dl class="fields">
        ${field(t("fAuthor"),namesHTML(d.author,d.author_en,d.z.author)+mt(d,"author"),true)}
        ${fieldM(t("fPub"),d,"publisher",v(d,"publisher"))}
        ${fieldM(t("fYearD"),d,"year",v(d,"year"))}
        ${field(t("fOwner"),ownerField+mt(d,"owner"),!!d.owner)}
        ${fieldM(t("fColl"),d,"collection",v(d,"collection"))}
      </dl>
      ${kome?`<p class="fn">${t("kome")}</p>`:""}
      ${d.owner?`<p class="fn">${t("ownerNote")}</p>`:""}
    </article>
    ${relatedHTML(r)}${ownHTML}
    ${FOOT()}
  </div>`;
  bindCommon();
}

/* ---------- chapter ---------- */
function renderChapter(n){
  const ws=WORKS.filter(w=>w.ch===n), ds=DOCS.filter(d=>d.ch===n);
  const tab = (()=>{ try{return sessionStorage.getItem("tab"+n)||"w";}catch(e){return "w";} })();
  app.innerHTML=`<div class="wrap">
    ${topNav(undefined,undefined,t("top"))}
    <div class="did">${t("chapter")}</div>
    ${badge(n,true)}
    ${ds.length?`<div class="tabs" role="tablist">
      <button role="tab" data-t="w" class="${tab==="w"?"on":""}">${t("works")} ${ws.length}</button>
      <button role="tab" data-t="d" class="${tab==="d"?"on":""}">${t("docs")} ${ds.length}</button>
    </div>`:""}
    <section class="sec" data-p="w" ${tab==="w"||!ds.length?"":"hidden"}>${H2(t("listW"),ws.length)}${listHTML(ws)}</section>
    ${ds.length?`<section class="sec" data-p="d" ${tab==="d"?"":"hidden"}>${H2(t("listD"),ds.length)}${listHTML(ds)}</section>`:""}
    ${FOOT()}
  </div>`;
  bindCommon();
  app.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{
    const tt=b.dataset.t; try{sessionStorage.setItem("tab"+n,tt);}catch(e){}
    app.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x.dataset.t===tt));
    app.querySelectorAll("[data-p]").forEach(x=>x.hidden = x.dataset.p!==tt);
  }));
}

/* ---------- router: #D1-001 / #A1-01 / #ch1 ---------- */
function route(keepScroll){
  window.onscroll=null;
  const h=current;
  let m;
  if(docById[h]!=null){ renderDoc(h); if(!keepScroll) window.scrollTo(0,0); return; }
  if((m=h.match(/^A([0-6]-\d{2})$/)) && workById[m[1]]!=null){ renderWork(m[1]); if(!keepScroll) window.scrollTo(0,0); return; }
  if((m=h.match(/^ch([0-6])$/))){ renderChapter(+m[1]); if(!keepScroll) window.scrollTo(0,0); return; }
  renderHome(); if(!keepScroll) window.scrollTo(0,lastHomeScroll);
}
document.documentElement.lang=HTML_LANG();
/* navigation without relying on <a href="#..."> (some viewers intercept link taps) */
function readHash(){ try{ return decodeURIComponent((location.hash||"").slice(1)); }catch(e){ return ""; } }
let current = readHash();
function go(h){
  if(!current && h) lastHomeScroll = window.scrollY;
  current = h;
  try{ if(readHash()!==h) location.hash = h; }catch(e){}
  route();
}
window.addEventListener("hashchange",()=>{ const h=readHash(); if(h!==current){ current=h; route(); } });
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-go]");
  if(!el || el.disabled) return;
  e.preventDefault();
  go(el.dataset.go);
});
route();

</script>
</body>
